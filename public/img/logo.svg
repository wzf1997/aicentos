<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">aicentos logo</title>
  <desc id="desc">A warm rose and gold abstract lowercase a mark with connected AI nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="56" y1="28" x2="456" y2="484" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c85c80"/>
      <stop offset="0.52" stop-color="#c9973e"/>
      <stop offset="1" stop-color="#9a6f20"/>
    </linearGradient>
    <radialGradient id="glow" cx="34%" cy="18%" r="72%">
      <stop offset="0" stop-color="#fff3e4" stop-opacity="0.42"/>
      <stop offset="0.46" stop-color="#ffe5cc" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2d2015" stop-opacity="0"/>
